services:
  trip-planner:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AMAP_WEB_JS_KEY: ${VITE_AMAP_WEB_JS_KEY:-your_amap_web_js_api_key_here}
        VITE_AMAP_SECURITY_JS_CODE: ${VITE_AMAP_SECURITY_JS_CODE:-your_amap_security_js_code_here}
    # 始终本地构建，不从镜像仓库拉取，方便调试
    pull_policy: build
    container_name: helloagents-trip-planner
    ports:
      - "7860:7860"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-your_key}
      - LLM_BASE_URL=${LLM_BASE_URL:-your_url}
      - LLM_MODEL_ID=${LLM_MODEL_ID:-your_model}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-600}
      # 行程规划阶段单独的超时（秒）。规划时 prompt 最长（含各城市景点、天气、
      # 酒店原文），需要比 LLM_TIMEOUT 更宽裕；只作用于规划这一次调用。
      - TRIP_PLANNER_TIMEOUT=${TRIP_PLANNER_TIMEOUT:-180}
      - VITE_AMAP_WEB_KEY=${VITE_AMAP_WEB_KEY:-your_amap_web_api_key_here}
      - XHS_COOKIE=${XHS_COOKIE:-your_xhs_cookie_here}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GOOGLE_MAPS_PROXY=${GOOGLE_MAPS_PROXY:-}
      - ENABLE_USER_MEMORY=${ENABLE_USER_MEMORY:-false}
      - MEMORY_THRESHOLD=${MEMORY_THRESHOLD:-2.0}
      - MIN_INIT_WEIGHT=${MIN_INIT_WEIGHT:-4.0}
      - MEMORY_DECAY_FACTOR=${MEMORY_DECAY_FACTOR:-0.97}
      - MEMORY_MAX_RECALL=${MEMORY_MAX_RECALL:-10}
      - MEMORY_MAX_SINGLE_CONTENT=${MEMORY_MAX_SINGLE_CONTENT:-120}
      - MEMORY_USE_SQLITE=${MEMORY_USE_SQLITE:-false}
      - HOST=0.0.0.0
      - PORT=7860
      - LOG_LEVEL=INFO
    volumes:
      - trip_data:/app/backend/data
      # 调试挂载：后端 Python 代码改动后只需 docker compose restart，无需重新构建镜像
      # （仅挂载 app 目录，避免覆盖镜像内 backend/node_modules 的小红书签名依赖）
      - ./backend/app:/app/backend/app
    restart: unless-stopped

volumes:
  trip_data:
